[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "driftcheck"
version = "0.1.0"
description = "Catch drift between your version numbers, dependency lists, and Python support claims before CI or a release does."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "mtparry147-coder", url = "https://github.com/mtparry147-coder" },
]
keywords = [
  "packaging",
  "metadata",
  "dependencies",
  "lint",
  "ci",
  "maintainer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "build>=1.2",
]

[project.scripts]
driftcheck = "driftcheck.cli:main"

[project.urls]
Homepage = "https://github.com/mtparry147-coder/driftcheck"
Source = "https://github.com/mtparry147-coder/driftcheck"
Issues = "https://github.com/mtparry147-coder/driftcheck/issues"
Changelog = "https://github.com/mtparry147-coder/driftcheck/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
driftcheck = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
