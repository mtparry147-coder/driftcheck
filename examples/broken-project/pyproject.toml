[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-pkg"
version = "0.2.0"
description = "A deliberately inconsistent project used by driftcheck's docs and tests."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.9",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
demo = "demo_pkg.cli:mian"

[project.urls]
Homepage = "https://example.com/demo-pkg"
